<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Balon Harapan – HUT ke-5 Bapelkes Mataram</title>
<style>
:root{--bg:#eef7ff;--bg2:#fdf3e4;--ink:#12304a;--mut:#5b7186;--card:#fff;--acc:#0e8f6e;--line:#cfe0ee}
@media (prefers-color-scheme:dark){:root{--bg:#0b1b2b;--bg2:#12283d;--ink:#e8f1f9;--mut:#9bb0c3;--card:#16314a;--acc:#35c79d;--line:#27455f}}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:linear-gradient(180deg,var(--bg),var(--bg2))}
.top{position:absolute;z-index:5;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top,0px) + .8rem) 1rem .6rem;pointer-events:none}
.top h1{margin:0;font-size:1.15rem}
.top p{margin:.2rem 0 0;color:var(--mut);font-size:.9rem}
.bar{position:absolute;z-index:5;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 1rem);display:flex;justify-content:center}
button{font:inherit;border:0;border-radius:12px;padding:.7rem 1.2rem;background:var(--acc);color:#fff;font-weight:600;cursor:pointer}
.balloon{position:absolute;left:0;top:0;width:74px;height:92px;cursor:pointer;will-change:transform}
.b{position:relative;width:100%;height:100%;border-radius:50% 50% 48% 48%}
.b::after{content:"";position:absolute;left:50%;bottom:-34px;width:2px;height:34px;background:var(--mut);opacity:.6}
.b::before{content:"";position:absolute;left:18%;top:14%;width:16%;height:22%;border-radius:50%;background:rgba(255,255,255,.55);transform:rotate(25deg)}
.b.pop{animation:pop .35s ease-out forwards}
@keyframes pop{to{transform:scale(1.8);opacity:0}}
#wish{position:absolute;z-index:6;left:50%;top:46%;transform:translate(-50%,-50%);width:min(90vw,640px);background:var(--card);border:2px solid var(--acc);border-radius:20px;padding:1.4rem 1.5rem;text-align:center;font-size:clamp(1.1rem,3vw,1.6rem);line-height:1.45;box-shadow:0 12px 40px rgba(0,0,0,.25)}
#wish small{display:block;color:var(--mut);font-size:.8rem;margin-bottom:.5rem}
.hide{display:none!important}
</style>
</head>
<body>
<div class="top"><h1>🎈 Balon Harapan Bapelkes Mataram</h1><p id="info">Memuat…</p></div>
<div id="wish" class="hide"></div>
<div class="bar"><button id="rnd">Pecahkan balon acak</button></div>

<script>
/* ====== PENGATURAN: tempel link CSV dari "Publikasikan ke web" Google Sheet di antara tanda kutip ====== */
var CSV_URL = "";
var KOLOM_HARAPAN = 1;      /* 0 = kolom A (stempel waktu), 1 = kolom B (harapan) */
var REFRESH_DETIK = 20;
/* ============================================================================================ */
(function(){
var COLORS=["#ef5b5b","#f5a623","#f7d34a","#4cc38a","#3fa9f5","#9b6bf2","#f06ab0"];
var $=function(i){return document.getElementById(i)};
var qs=new URLSearchParams(location.search); if(qs.get("csv")) CSV_URL=qs.get("csv");
var DEMO=["Semoga bisa menjadi panutan balai lain, jaya dan sukses selalu🫶🏻", "semoga bapelkes mataram semakin mendunia", "Semoga menjadi BBPK dengan sarpras dan SDM yang lengkap", "Bapelkes Mataram semakin Profesional, Inovatif dan Solid", "Semoga bapelkes mataram makin sukses", "Semoga tim Bapelkes Mataram semakin kompak dengan hadirnya pimpinan baru. Semua pegawai kerja dengan ikhlas, jujur, dan penuh dedikasi.", "Sukses bersama demi Indonesia yg berkualitas", "Semoga kedepannya lebih baik,bahagia,banyak perubahan,dan lebih banyak prestasi bagi pegawai bapelkes mataram", "Menjadi semakin maju, bisa menjadi tempat utk bertumbuh bersama yang nyaman.", "Semoga bapelkes Mataram makin jaya dan berakhlak", "Semoga tetap menjadi rumah yang nyaman..", "Semoga di Bapelkes ini, saya bisa kembali menjadi fungsional lagi he he", "Semakin inovatif, dan terus konsisten menjadi pusat pelatihan kesehatan", "Semoga jaya teruss", "Bapelkes semakin Maju dan terdepan dalam menyelenggarakan pelatihan Kesehatan", "Bapelkes Mataram semakin Maju & Berkembang", "Semoga lebih baik kedepannya🎉🥰😇", "Semoga bapelkes mtrm punya 10 ruang kls...dan laboratorium kls selain kebencanaan", "Tetap maju maju maju dan JAYA SELALUUUWWWWWWW", "Dengan kepemimpinan yang baru semoga bapelkes menjadi yang terbaik dari yang baik😊😊", "Semoga Bapelkes Mataram Semakin Maju dan bermanfaat bagi Masyarkat Indonesia, khususnya NTB...aamiienn", "Selamat ulang tahun bapelkes mataram semoga semakin baik dalam segala hal", "Semoga semakin baik kedepannya", "Semoga bapelkes Mataram bisa lebih maju dan lebih baik ke depan nya 😊😊", "Saya harap dapat membawa kesejahteraan pegawai lebih baik dan efisien", "Semoga kedepannya lebih baik", "Semoga semakin profesional, inovatif dan tetap solid.", "Semoga fasilitas dan perangkat yang mendukung pekerjaan dan kinerja pegawai dapat tersedia cepat dan baik, seperti air, dan laptop karena sudah tidak memadai", "Jadilah yang lebih baik lagi", "Menuju Bapelkes Emas 2027", "Semoga menjadi tempat yang nyaman untuk bertumbuh", "Semoga bapelkes Mataram menjadi tempat dalam mencetak SDM Kesehatan yang profesional dan berkompeten. Menjadi Balai pelatihan yang semakin maju dan berkembang serta berkontribusi untuk negara", "Semoga kedepannya lebih baik", "Semoga kedepanya menjadi lebih baik", "Semoga jaya selalu", "Semoga semakin solid & terus bertumbuh menjadi balai pelatihan rujukan di Indonesia khususnya terkait disasar manajemen"];
var wishes=[],live={},poppedSet={},tm;
try{ (JSON.parse(localStorage.getItem("bh-popped-v2")||"[]")).forEach(function(t){poppedSet[t]=1}); }catch(e){}
function savePopped(){ try{ localStorage.setItem("bh-popped-v2",JSON.stringify(Object.keys(poppedSet))) }catch(e){} }
function esc(s){var d=document.createElement("div");d.textContent=s;return d.innerHTML}
function info(){ var left=wishes.filter(function(w,k){return !poppedSet[k]}).length; $("info").textContent="Ketuk balon untuk memecahkannya • Tersisa "+left+" dari "+wishes.length+" balon"+""; }

function csv(s){var rows=[],row=[],cur="",q=false;
  for(var i=0;i<s.length;i++){var c=s[i];
    if(q){ if(c==='"'){ if(s[i+1]==='"'){cur+='"';i++} else q=false } else cur+=c; }
    else if(c==='"') q=true;
    else if(c===","){row.push(cur);cur=""}
    else if(c==="\n"||c==="\r"){ if(c==="\r"&&s[i+1]==="\n") i++; row.push(cur);rows.push(row);row=[];cur=""}
    else cur+=c; }
  if(cur||row.length){row.push(cur);rows.push(row)}
  return rows;
}
function rx(){return 8+Math.random()*Math.max(innerWidth-100,50)}
function place(o){ o.el.style.transform="translate3d("+o.x+"px,"+(innerHeight-o.y-92)+"px,0)"; }
function spawn(i,spread){
  if(live[i]) return;
  var el=document.createElement("div"); el.className="balloon";
  var b=document.createElement("div"); b.className="b"; b.style.background=COLORS[Math.floor(Math.random()*COLORS.length)]; el.appendChild(b);
  var o={el:el,x:rx(),y:spread?Math.random()*innerHeight:-150,v:22+Math.random()*20};
  place(o);
  el.addEventListener("click",function(){popOne(i)});
  document.body.appendChild(el); live[i]=o;
}
var last=performance.now();
(function tick(t){
  var dt=Math.min((t-last)/1000,0.1); last=t;
  for(var k in live){ var o=live[k]; o.y+=o.v*dt; if(o.y>innerHeight+40){ o.y=-150; o.x=rx(); } place(o); }
  requestAnimationFrame(tick);
})(last);
function popOne(i){
  var o=live[i]; if(!o) return; delete live[i]; var el=o.el;
  el.firstChild.classList.add("pop"); setTimeout(function(){el.remove()},350);
  var t=wishes[i].text; poppedSet[i]=1; savePopped();
  var w=$("wish"); w.innerHTML="<small>Harapan untuk Bapelkes Mataram</small>"+esc(t);
  w.classList.remove("hide"); clearTimeout(tm); tm=setTimeout(function(){w.classList.add("hide")},12000);
  info();
}
$("wish").addEventListener("click",function(){$("wish").classList.add("hide")});
$("rnd").addEventListener("click",function(){ var ids=Object.keys(live); if(ids.length) popOne(ids[Math.floor(Math.random()*ids.length)]); });

function merge(texts,first){
  var have={}; wishes.forEach(function(w){have[w.text]=(have[w.text]||0)+1});
  texts.forEach(function(t){
    if(have[t]>0){have[t]--;return}
    wishes.push({text:t}); var i=wishes.length-1; if(!poppedSet[i]) spawn(i,first);
  });
  info();
}
function load(first){
  if(!CSV_URL){ if(first) merge(DEMO,true); return; }
  fetch(CSV_URL+(CSV_URL.indexOf("?")>-1?"&":"?")+"t="+Date.now(),{cache:"no-store"})
    .then(function(r){return r.text()})
    .then(function(txt){
      var rows=csv(txt).slice(1);
      var texts=rows.map(function(r){ var v=(r[KOLOM_HARAPAN]!==undefined?r[KOLOM_HARAPAN]:r[r.length-1])||""; return v.replace(/\s+/g," ").trim(); }).filter(function(v){return v});
      merge(texts,first);
    })
    .catch(function(){ if(first) $("info").textContent="Gagal memuat data harapan. Periksa link CSV dan koneksi internet."; });
}
load(true);
if(CSV_URL) setInterval(function(){load(false)},REFRESH_DETIK*1000);
})();
</script>
</body>
</html>
