<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Balon Harapan – HUT ke-5 Bapelkes Mataram</title>
<style>
:root{--bg:#eef7ff;--bg2:#fdf3e4;--ink:#12304a;--mut:#5b7186;--card:#fff;--acc:#0e8f6e;--line:#cfe0ee}
@media (prefers-color-scheme:dark){:root{--bg:#0b1b2b;--bg2:#12283d;--ink:#e8f1f9;--mut:#9bb0c3;--card:#16314a;--acc:#35c79d;--line:#27455f}}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:linear-gradient(180deg,var(--bg),var(--bg2))}
.top{position:absolute;z-index:5;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top,0px) + .8rem) 1rem .6rem;pointer-events:none}
.top h1{margin:0;font-size:1.15rem}
.top p{margin:.2rem 0 0;color:var(--mut);font-size:.9rem}
.bar{position:absolute;z-index:5;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 1rem);display:flex;justify-content:center}
button{font:inherit;border:0;border-radius:12px;padding:.7rem 1.2rem;background:var(--acc);color:#fff;font-weight:600;cursor:pointer}
.balloon{position:absolute;bottom:-170px;width:74px;height:92px;border-radius:50% 50% 48% 48%;animation:rise linear infinite;cursor:pointer}
.balloon::after{content:"";position:absolute;left:50%;bottom:-34px;width:2px;height:34px;background:var(--mut);opacity:.6}
.balloon::before{content:"";position:absolute;left:18%;top:14%;width:16%;height:22%;border-radius:50%;background:rgba(255,255,255,.55);transform:rotate(25deg)}
.balloon.pop{animation:pop .35s ease-out forwards}
@keyframes rise{from{transform:translateY(0)}to{transform:translateY(calc(-100vh - 330px))}}
@keyframes pop{to{transform:scale(1.8);opacity:0}}
#wish{position:absolute;z-index:6;left:50%;top:46%;transform:translate(-50%,-50%);width:min(90vw,640px);background:var(--card);border:2px solid var(--acc);border-radius:20px;padding:1.4rem 1.5rem;text-align:center;font-size:clamp(1.1rem,3vw,1.6rem);line-height:1.45;box-shadow:0 12px 40px rgba(0,0,0,.25)}
#wish small{display:block;color:var(--mut);font-size:.8rem;margin-bottom:.5rem}
.hide{display:none!important}
</style>
</head>
<body>
<div class="top"><h1>🎈 Balon Harapan Bapelkes Mataram</h1><p id="info">Memuat…</p></div>
<div id="wish" class="hide"></div>
<div class="bar"><button id="rnd">Pecahkan balon acak</button></div>

<script>
/* ====== PENGATURAN: tempel link CSV dari "Publikasikan ke web" Google Sheet di antara tanda kutip ====== */
var CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTb0TgxMOvbr-CF1LzEhC-2BxyyYEjEJxdXvCzqAvuNT3YfLn5lSHx9VyD1IPUH08fmkcPZC-_u8LGW/pub?gid=2092849480&single=true&output=csv";
var KOLOM_HARAPAN = 1;      /* 0 = kolom A (stempel waktu), 1 = kolom B (harapan) */
var REFRESH_DETIK = 20;
/* ============================================================================================ */
(function(){
var COLORS=["#ef5b5b","#f5a623","#f7d34a","#4cc38a","#3fa9f5","#9b6bf2","#f06ab0"];
var $=function(i){return document.getElementById(i)};
var qs=new URLSearchParams(location.search); if(qs.get("csv")) CSV_URL=qs.get("csv");
var DEMO=["Semoga Bapelkes Mataram makin hebat dan kompak!","Semoga setiap pelatihan membawa perubahan nyata.","Selamat ulang tahun Bapelkes Mataram!"];
var wishes=[],live={},poppedSet={},tm;
try{ (JSON.parse(localStorage.getItem("bh-popped")||"[]")).forEach(function(t){poppedSet[t]=1}); }catch(e){}
function savePopped(){ try{ localStorage.setItem("bh-popped",JSON.stringify(Object.keys(poppedSet))) }catch(e){} }
function esc(s){var d=document.createElement("div");d.textContent=s;return d.innerHTML}
function info(){ var left=wishes.filter(function(w){return !poppedSet[w.text]}).length; $("info").textContent="Ketuk balon untuk memecahkannya • Tersisa "+left+" dari "+wishes.length+" balon"+(CSV_URL?"":" (mode contoh)"); }

function csv(s){var rows=[],row=[],cur="",q=false;
  for(var i=0;i<s.length;i++){var c=s[i];
    if(q){ if(c==='"'){ if(s[i+1]==='"'){cur+='"';i++} else q=false } else cur+=c; }
    else if(c==='"') q=true;
    else if(c===","){row.push(cur);cur=""}
    else if(c==="\n"||c==="\r"){ if(c==="\r"&&s[i+1]==="\n") i++; row.push(cur);rows.push(row);row=[];cur=""}
    else cur+=c; }
  if(cur||row.length){row.push(cur);rows.push(row)}
  return rows;
}
function spawn(i,spread){
  if(live[i]) return;
  var el=document.createElement("div"); el.className="balloon";
  el.style.left=(4+Math.random()*86)+"%";
  el.style.background=COLORS[Math.floor(Math.random()*COLORS.length)];
  el.style.animationDuration=(28+Math.random()*17)+"s";
  if(spread) el.style.animationDelay="-"+(Math.random()*26)+"s";
  el.addEventListener("animationiteration",function(e){ if(e.animationName==="rise") el.style.left=(4+Math.random()*86)+"%"; });
  el.addEventListener("click",function(){popOne(i)});
  document.body.appendChild(el); live[i]=el;
}
function popOne(i){
  var el=live[i]; if(!el) return; delete live[i];
  el.style.animationDelay="0s"; el.style.animationDuration=".35s"; el.classList.add("pop"); setTimeout(function(){el.remove()},350);
  var t=wishes[i].text; poppedSet[t]=1; savePopped();
  var w=$("wish"); w.innerHTML="<small>Harapan untuk Bapelkes Mataram</small>"+esc(t);
  w.classList.remove("hide"); clearTimeout(tm); tm=setTimeout(function(){w.classList.add("hide")},12000);
  info();
}
$("wish").addEventListener("click",function(){$("wish").classList.add("hide")});
$("rnd").addEventListener("click",function(){ var ids=Object.keys(live); if(ids.length) popOne(ids[Math.floor(Math.random()*ids.length)]); });

function merge(texts,first){
  var have={}; wishes.forEach(function(w){have[w.text]=(have[w.text]||0)+1});
  texts.forEach(function(t){
    if(have[t]>0){have[t]--;return}
    wishes.push({text:t}); var i=wishes.length-1; if(!poppedSet[t]) spawn(i,first);
  });
  info();
}
function load(first){
  if(!CSV_URL){ if(first) merge(DEMO,true); return; }
  fetch(CSV_URL+(CSV_URL.indexOf("?")>-1?"&":"?")+"t="+Date.now(),{cache:"no-store"})
    .then(function(r){return r.text()})
    .then(function(txt){
      var rows=csv(txt).slice(1);
      var texts=rows.map(function(r){ var v=(r[KOLOM_HARAPAN]!==undefined?r[KOLOM_HARAPAN]:r[r.length-1])||""; return v.replace(/\s+/g," ").trim(); }).filter(function(v){return v});
      merge(texts,first);
    })
    .catch(function(){ if(first) $("info").textContent="Gagal memuat data harapan. Periksa link CSV dan koneksi internet."; });
}
load(true);
if(CSV_URL) setInterval(function(){load(false)},REFRESH_DETIK*1000);
})();
</script>
</body>
</html>
